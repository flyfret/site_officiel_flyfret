name: Deploy to o2switch

# Déclenchement uniquement sur les tags v*
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code depuis GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Installer PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # 3️⃣ Installer les dépendances PHP
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # 4️⃣ Synchroniser les fichiers sur o2switch via rsync
      - name: Rsync files to o2switch
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude-from=deploy/rsync-exclude.txt
          path: ./
          remote_path: ${{ secrets.SERVER_TARGET_PATH }}   # chemin sur le serveur
          remote_host: ${{ secrets.SERVER_HOST }}         # adresse SSH
          remote_user: ${{ secrets.SERVER_USER }}         # utilisateur SSH
          remote_key: ${{ secrets.SERVER_SSH_KEY }}       # clé privée SSH

      # 5️⃣ Exécuter les commandes post-déploiement
      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_TARGET_PATH }}
            # Installer les dépendances PHP sur le serveur si nécessaire
            composer install --no-dev --optimize-autoloader
            # Lancer les migrations en production
            php artisan migrate --force
            # Optimiser les caches
            php artisan config:cache
            php artisan route:cache
